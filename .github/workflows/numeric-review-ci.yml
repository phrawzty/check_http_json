name: Numeric review CI (temporary)
on:
  push:
    branches:
      - review/numeric-values-v2
  workflow_dispatch:
  pull_request:
    branches:
      - review/upstream-v2-base
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.1', '3.3']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: ruby -c check_http_json.rb
      - run: bundle exec rake test
  ruby23_smoke:
    runs-on: ubuntu-latest
    container:
      image: ruby:2.3
    steps:
      - uses: actions/checkout@v4
      - name: Ruby 2.3 syntax and numeric CLI smoke
        shell: bash
        run: |
          ruby --version
          ruby -c check_http_json.rb
          printf '{"value":10.5}\n' > /tmp/numeric.json
          set +e
          ruby check_http_json.rb -f /tmp/numeric.json -e value -w 10 -c 20
          result=$?
          set -e
          test "$result" -eq 1
          printf '{"value":-1.5}\n' > /tmp/numeric.json
          ruby check_http_json.rb -f /tmp/numeric.json -e value -w=-20:20 -c=-30:30
